<html lang="zh-TW">
<head>

  <style>

      --primary-color: #1e3a27;      /* 森林深綠 */
      --secondary-color: #4f6f52;    /* 鼠尾草綠 */
      --accent-color: #c89f53;       /* 金黃點綴 */

    body {
      font-family: 'Outfit', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;

      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;

      z-index: 1000;
      border-bottom: 2px solid var(--accent-color);
    }

    header h1 {
      font-size: 1.25rem;

      display: flex;
      align-items: center;
      gap: 8px;
    }

    }

    .subtitle {
      font-size: 0.85rem;

      font-weight: 300;
    }

    .main-container {
      flex: 1;
      display: flex;
      flex-direction: row;

      height: calc(100dvh - 54px);

    }

      box-shadow: var(--shadow-md);

    .tab-btn {

    .tab-btn.active {

    .panel.active {

    .search-box {

    }

    .search-input {

    }

    .tip-card {

      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .location-list {
      display: flex;
      flex-direction: column;
      gap: 12px;

    .location-card {
      background-color: white;
      border-radius: var(--border-radius);
      padding: 16px;

    .card-meta {

<body>

  <header>
    <h1><span class="logo-emoji">🌿</span>清明尋陵 <span style="font-weight:300; font-size:1rem;">| 掃墓地圖協作系統 (雲端版)</span></h1>
    <div style="display:flex; align-items:center; gap:10px;">
      <button onclick="exportData()" style="padding:6px 12px; font-size:0.85rem; font-weight:bold; border:none; border-radius:6px; cursor:pointer; background:var(--accent-color); color:white;">📥 備份資料</button>
      <div class="subtitle" style="display:flex; flex-direction:column; align-items:flex-end; gap:2px;">
        <div>永久免費雲端版</div>
        <div style="font-size:0.75rem; opacity:0.85; color:var(--accent-color);">v1.4.0 (2026-08-23)</div>
      </div>
    </div>
  </header>

  <div class="main-container">
    <div id="map"></div>

    <div class="sidebar">
      <div class="tabs-container">
        <button class="tab-btn active" onclick="switchTab('list-tab')">🔍 尋找墓地</button>
        <button class="tab-btn" onclick="switchTab('add-tab')">📍 新增記錄</button>
        <button class="tab-btn" onclick="switchTab('msg-tab')">💬 留言板</button>
      </div>

      <div id="list-tab" class="panel panel-content active">
        <!-- 🔥 年度掃墓進度卡片 -->
        <div class="year-progress-card" style="background: white; border-radius: var(--border-radius); padding: 14px; margin-bottom: 12px; border: 1px solid rgba(79, 111, 82, 0.15); box-shadow: var(--shadow-sm);">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <div style="font-weight:700; color:var(--primary-color); display:flex; align-items:center; gap:6px; font-size:0.95rem;">
              <span>🧹 掃墓年度：</span>
              <select id="year-select" onchange="changeSelectedYear(this.value)" style="padding:4px 8px; border-radius:6px; border:1px solid rgba(79,111,82,0.3); font-size:0.9rem; font-weight:bold; color:var(--primary-color); background:#f7f9f6; cursor:pointer;">
              </select>
            </div>
            <span id="progress-text" style="font-size:0.85rem; font-weight:bold; color:var(--secondary-color);">0/0 (0%)</span>
          </div>
          <div style="width:100%; background:#e0e0e0; height:8px; border-radius:4px; overflow:hidden;">
            <div id="progress-bar" style="width:0%; height:100%; background:linear-gradient(90deg, #4caf50, #2e7d32); transition:width 0.4s ease;"></div>
          </div>
        </div>

        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-input" class="search-input" placeholder="輸入墓地名稱或祖先姓名搜尋..." oninput="filterLocations()">
        </div>

        <div id="location-list" class="location-list">
          <!-- 動態載入 -->
        </div>
      </div>

      <div id="add-tab" class="panel panel-content">
        <div class="tip-card">
          🎯 <strong>標記方式：</strong><br>
          1. 站在現場點擊 <strong>[抓取手機位置]</strong>。<br>
          2. 或直接在<strong>地圖上點一下</strong>，系統會自動帶入下方經緯度。
        </div>

        <form id="add-location-form" onsubmit="submitForm(event)">
          <button type="button" id="gps-btn" class="btn btn-gps" onclick="getCurrentLocation()">
            📍 抓取目前手機 GPS 位置
          </button>
          <div id="gps-status" style="font-size: 0.78rem; text-align: center; color: var(--secondary-color); margin-top: -8px;"></div>

          <div class="form-row">
            <div class="form-group">
              <label for="lat">緯度 (Latitude)</label>
              <input type="number" id="lat" name="lat" step="any" class="form-control" placeholder="定位坐標" required>
            </div>
            <div class="form-group">
              <label for="lng">經度 (Longitude)</label>
              <input type="number" id="lng" name="lng" step="any" class="form-control" placeholder="定位坐標" required>
            </div>
          </div>

          <div class="form-group">
            <label for="name">墓地俗稱 / 名稱 *</label>
            <input type="text" id="name" name="name" class="form-control" placeholder="例如：大尖山阿公墓" required>
          </div>

          <div class="form-group">
            <label for="ancestor">供奉祖先 / 堂號</label>
            <input type="text" id="ancestor" name="ancestor" class="form-control" placeholder="例如：顯考 林公諱登科">
          </div>

          <div class="form-group">
            <label for="description">路線指引 / 特徵描述 / 備忘</label>
            <textarea id="description" name="description" class="form-control" rows="3" placeholder="例如：金爐旁小徑走進去、在紅磚屋後面"></textarea>
          </div>

          <div class="form-group">
            <label for="recorder">記錄人姓名 *</label>
            <input type="text" id="recorder" name="recorder" class="form-control" placeholder="例如：大堂哥小明" required>
          </div>

          <div class="form-group">
            <label>現場實拍照片</label>
            <div class="file-upload-container">
              <input type="file" id="photo" name="photo" class="file-upload-input" accept="image/*" multiple onchange="previewImages(event)">
              <div class="upload-placeholder" id="upload-placeholder">
                <span class="icon">📸</span>
                <span>點此拍現場照片或從相簿選擇 (最多10張)</span>
              </div>
              <div id="img-preview-container" style="display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; position:relative; z-index:2;"></div>
            </div>
          </div>

          <div style="display:flex; gap:10px; margin-top: 10px;">
            <button type="submit" id="submit-btn" class="btn btn-primary" style="flex:1;">
              💾 儲存並新增墓地
            </button>
            <button type="button" id="cancel-edit-btn" class="btn" style="display:none; background-color:#e0e0e0; color:#333; flex:1;" onclick="cancelEdit()">
              取消
            </button>
            <button type="button" id="delete-record-btn" class="btn" style="display:none; background-color:#db4437; color:white; flex:1; padding: 12px 10px;" onclick="deleteRecord()">
              🗑️ 刪除
            </button>
          </div>
        </form>
      </div>

      <div id="msg-tab" class="panel panel-content">
        <form id="msg-form" onsubmit="submitMessage(event)" style="margin-bottom: 20px; padding: 15px; background: rgba(200, 159, 83, 0.05); border-radius: 8px; border: 1px solid rgba(200, 159, 83, 0.3);">
          <div style="font-weight: bold; color: var(--primary-color); margin-bottom: 10px;">我要留言</div>
          <div class="form-group" style="margin-bottom: 10px;">
            <input type="text" id="msg-author" class="form-control" placeholder="您的稱呼 (必填)" required>
          </div>
          <div class="form-group" style="margin-bottom: 10px;">
            <textarea id="msg-content" class="form-control" rows="3" placeholder="想對大家說的話... (必填)" required></textarea>
          </div>
          <button type="submit" id="msg-submit-btn" class="btn btn-primary" style="width: 100%;">🚀 送出留言</button>
        </form>
        <div id="msg-list" style="display: flex; flex-direction: column; gap: 12px;">
          <!-- 留言列表會在這裡載入 -->
        </div>
      </div>

    </div>
  </div>

      storageBucket: "tomb-map-tw.firebasestorage.app",

  <script>

    let map;
    let markersGroup;
    let tempMarker = null;
    let allLocations = [];
    let currentSelectedYear = "2027";

    function initYearSelect() {
      const select = document.getElementById('year-select');
      if (!select) return;
      select.innerHTML = '';
      const years = ["2027", "2028"];
      if (!years.includes(currentSelectedYear)) currentSelectedYear = "2027";
      years.forEach(y => {
        const opt = document.createElement('option');
        opt.value = y;
        opt.innerText = `${y} 年`;
        if (y === currentSelectedYear) opt.selected = true;
        select.appendChild(opt);
      });
    }

    function changeSelectedYear(year) {
      currentSelectedYear = year;
      renderLocationList(allLocations);
      renderMapMarkers(allLocations);
      updateProgressBar();
    }

    function isSwept(loc, year) {
      if (!loc || !loc.swept_years) return false;
      let sy = loc.swept_years;
      if (typeof sy === 'string') {
        try { sy = JSON.parse(sy); } catch(e) { return false; }
      }
      return !!(sy[year] && sy[year].swept);
    }

    function getSweptInfo(loc, year) {
      if (!isSwept(loc, year)) return null;
      let sy = loc.swept_years;
      if (typeof sy === 'string') {
        try { sy = JSON.parse(sy); } catch(e) { return null; }
      }
      return sy[year] || {};
    }

    function updateProgressBar() {
      const total = allLocations.length;
      const textElem = document.getElementById('progress-text');
      const barElem = document.getElementById('progress-bar');
      if (!textElem || !barElem) return;

      if (total === 0) {
        textElem.innerText = '0/0 (0%)';
        barElem.style.width = '0%';
        return;
      }
      const sweptCount = allLocations.filter(loc => isSwept(loc, currentSelectedYear)).length;
      const percent = Math.round((sweptCount / total) * 100);
      textElem.innerText = `${sweptCount}/${total} 處已掃 (${percent}%)`;
      barElem.style.width = `${percent}%`;
    }

    async function toggleSweptStatus(id) {
      const loc = allLocations.find(l => l.id === id);
      if (!loc) return;

      const currentlySwept = isSwept(loc, currentSelectedYear);
      let sy = loc.swept_years || {};
      if (typeof sy === 'string') {
        try { sy = JSON.parse(sy); } catch(e) { sy = {}; }
      } else {
        sy = { ...sy };
      }

      if (!currentlySwept) {

    // 📸 上傳單張照片到 imgbb，回傳公開 URL
    async function uploadToImgbb(file) {
      const reader = new FileReader();
      return new Promise((resolve, reject) => {
        reader.onload = async (e) => {
          try {
            const base64 = e.target.result.split(',')[1];
            const form = new FormData();
            form.append('key', window._IMGBB_API_KEY);
            form.append('image', base64);
            const res = await fetch('https://api.imgbb.com/1/upload', { method: 'POST', body: form });
            const data = await res.json();
            if (!data.success) throw new Error(data.error?.message || '上傳失敗');
            resolve(data.data.url);
          } catch (err) { reject(err); }
        };
        reader.readAsDataURL(file);
      });
    }

    async function compressImage(file, maxSizeKB = 500) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = event => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            const MAX_SIZE = 1920;
            if (width > height && width > MAX_SIZE) {
              height *= MAX_SIZE / width;
              width = MAX_SIZE;
            } else if (height > MAX_SIZE) {
              width *= MAX_SIZE / height;
              height = MAX_SIZE;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            let quality = 0.8;
            let dataUrl = canvas.toDataURL('image/jpeg', quality);
            
            const maxBytes = maxSizeKB * 1024;
            while (dataUrl.length * 0.75 > maxBytes && quality > 0.1) {
              quality -= 0.1;
              dataUrl = canvas.toDataURL('image/jpeg', quality);
            }
            
            fetch(dataUrl)
              .then(res => res.blob())
              .then(blob => {
                const newFile = new File([blob], file.name.replace(/\.[^/.]+$/, "") + ".jpg", { type: 'image/jpeg' });
                resolve(newFile);
              });
          };
        };
        reader.onerror = error => reject(error);
      });
    }

    
    async function previewImages(event) {
      const input = event.target;
      const container = document.getElementById('img-preview-container');
      const placeholder = document.getElementById('upload-placeholder');
      
      if (!input.files || input.files.length === 0) return;
      
      if (input.files.length + selectedFiles.length + existingPhotoUrls.length > 10) {
        alert("總照片數最多只能 10 張！");
        return;
      }

      placeholder.innerHTML = "<span class='icon'>⏳</span><span>正在壓縮照片中...</span>";
      
      for (let i = 0; i < input.files.length; i++) {
        if (selectedFiles.length + existingPhotoUrls.length >= 10) break;
        const compressedFile = await compressImage(input.files[i], 500);
        selectedFiles.push(compressedFile);
        
        const img = document.createElement('img');
        img.src = URL.createObjectURL(compressedFile);
        img.className = 'image-preview';
        img.style.display = 'block';
        img.style.width = '70px';
        img.style.height = '70px';
        img.style.objectFit = 'cover';
        img.style.cursor = 'pointer';
        
        img.dataset.type = 'new';
        img.dataset.index = selectedFiles.length - 1; // It was just pushed
        img.onclick = function() {
          if (confirm("確定要刪除這張照片嗎？")) {
            const index = selectedFiles.indexOf(compressedFile);
            if (index > -1) selectedFiles.splice(index, 1);
            container.removeChild(img);
            updatePlaceholder();
          }
        };

        container.appendChild(img);
      }
      
      updatePlaceholder();
      input.value = ''; 
    }

    function focusLocation(id) {
      const loc = allLocations.find(l => l.id === id);
      if (!loc) return;
      highlightListCard(loc.id);
      markersGroup.eachLayer(marker => {
        const latLng = marker.getLatLng();
        if (Math.abs(latLng.lat - loc.lat) < 0.000001 && Math.abs(latLng.lng - loc.lng) < 0.000001) {
          map.flyTo([loc.lat, loc.lng], 17, { duration: 1.5 });
          setTimeout(() => marker.openPopup(), 1500);
        }
      });
    }

    function highlightListCard(id) {
      document.querySelectorAll('.location-card').forEach(card => card.classList.remove('selected'));
      const activeCard = document.getElementById(`card-${id}`);
      if (activeCard) {
        activeCard.classList.add('selected');
        activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function filterLocations() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const filtered = allLocations.filter(loc => {
        return (
          loc.name.toLowerCase().includes(query) ||
          loc.ancestor.toLowerCase().includes(query) ||
          (loc.description && loc.description.toLowerCase().includes(query)) ||
          loc.recorder.toLowerCase().includes(query)
        );
      });
      renderLocationList(filtered);
    }

      }
      
      const form = document.getElementById('add-location-form');
      const formData = new FormData(form);

      const lat = parseFloat(formData.get('lat'));
      const lng = parseFloat(formData.get('lng'));
      const name = formData.get('name');
      const ancestor = formData.get('ancestor');
      const description = formData.get('description');
      const recorder = formData.get('recorder');

      if (isNaN(lat) || isNaN(lng)) {
        alert('請先在地圖點擊位置或取得手機定位以帶入經緯度！');
        return;
      }

      const submitBtn = document.getElementById('submit-btn');
      const originalText = submitBtn.innerText;
      submitBtn.disabled = true;
      submitBtn.innerText = "⏳ 正在處理中...";

      try {
        const { addDoc, updateDoc, doc, collection, serverTimestamp } = fb();
        let finalPhotoUrls = [];

        // 📸 上傳新照片到 imgbb
        if (selectedFiles.length > 0) {
          submitBtn.innerText = `⏳ 上傳照片中 (0/${selectedFiles.length})...`;
          for (let i = 0; i < selectedFiles.length; i++) {
            submitBtn.innerText = `⏳ 上傳照片中 (${i+1}/${selectedFiles.length})...`;
            const publicUrl = await uploadToImgbb(selectedFiles[i]);
            finalPhotoUrls.push(publicUrl);
          }
        }

        // 依照預覽容器順序組合所有照片 URL
        let allUrls = [];
        const container = document.getElementById('img-preview-container');
        let newUploadIndex = 0;
        for (let child of container.children) {
          if (child.dataset.type === 'existing') {
            allUrls.push(child.dataset.url);
          } else if (child.dataset.type === 'new') {
            allUrls.push(finalPhotoUrls[newUploadIndex]);
            newUploadIndex++;
          }
        }

        const payload = {
          name: name.trim(),
          ancestor: ancestor ? ancestor.trim() : '',
          description: description ? description.trim() : '',
          recorder: recorder ? recorder.trim() : '匿名家族成員',
          lat: lat,
          lng: lng,
          photo_url: allUrls.length > 0 ? JSON.stringify(allUrls) : null,
          created_at: serverTimestamp()
        };

        if (editingId) {
          // 更新時不覆蓋 created_at
          const updatePayload = { ...payload };
          delete updatePayload.created_at;
          await updateDoc(doc(getDB(), 'locations', editingId), updatePayload);
          alert(`成功修改墓地記錄：${name}！`);
        } else {
          await addDoc(collection(getDB(), 'locations'), payload);
          alert(`成功新增墓地記錄：${name}！`);
        }

        cancelEdit();
        await loadLocations();
        switchTab('list-tab');

      } catch (error) {
        alert('操作失敗：' + error.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = originalText;
      }
    }


    function openFullscreenPhoto(photos, startIndex = 0) {
      let photoList = [];
      let currentIndex = 0;
      if (typeof photos === 'string') {
        photoList = [photos];
        currentIndex = 0;
      } else if (Array.isArray(photos)) {
        photoList = photos;
        currentIndex = startIndex;
      }
      
      if (photoList.length === 0) return;

      const overlay = document.createElement('div');
      overlay.style.position = 'fixed';
      overlay.style.top = '0';
      overlay.style.left = '0';
      overlay.style.width = '100vw';
      overlay.style.height = '100dvh';
      overlay.style.backgroundColor = 'rgba(0,0,0,0.95)';
      overlay.style.zIndex = '9999';
      overlay.style.display = 'flex';
      overlay.style.flexDirection = 'column';
      overlay.style.alignItems = 'center';
      overlay.style.justifyContent = 'center';
      overlay.style.userSelect = 'none';

      const container = document.createElement('div');
      container.style.position = 'relative';
      container.style.width = '100%';
      container.style.height = '80%';
      container.style.display = 'flex';
      container.style.alignItems = 'center';
      container.style.justifyContent = 'center';
      container.style.overflow = 'hidden';
      overlay.appendChild(container);

      const img = document.createElement('img');
      img.style.maxWidth = '95%';
      img.style.maxHeight = '95%';
      img.style.objectFit = 'contain';
      img.style.borderRadius = '8px';
      img.style.border = '2px solid rgba(255, 255, 255, 0.8)';
      img.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
      img.style.boxShadow = '0 10px 25px rgba(0,0,0,0.5)';
      container.appendChild(img);

      const closeBtn = document.createElement('div');
      closeBtn.innerHTML = '✕';
      closeBtn.style.position = 'absolute';
      closeBtn.style.top = '20px';
      closeBtn.style.right = '20px';
      closeBtn.style.color = '#fff';
      closeBtn.style.fontSize = '30px';
      closeBtn.style.fontWeight = 'bold';
      closeBtn.style.cursor = 'pointer';
      closeBtn.style.zIndex = '10001';
      closeBtn.style.width = '44px';
      closeBtn.style.height = '44px';
      closeBtn.style.display = 'flex';
      closeBtn.style.alignItems = 'center';
      closeBtn.style.justifyContent = 'center';
      closeBtn.style.borderRadius = '50%';
      closeBtn.style.backgroundColor = 'rgba(0, 0, 0, 0.4)';
      overlay.appendChild(closeBtn);

      let prevBtn, nextBtn;
      if (photoList.length > 1) {
        prevBtn = document.createElement('div');
        prevBtn.innerHTML = '&#10094;';
        prevBtn.style.position = 'absolute';
        prevBtn.style.left = '20px';
        prevBtn.style.color = '#fff';
        prevBtn.style.fontSize = '36px';
        prevBtn.style.cursor = 'pointer';
        prevBtn.style.zIndex = '10001';
        prevBtn.style.width = '50px';
        prevBtn.style.height = '50px';
        prevBtn.style.display = 'flex';
        prevBtn.style.alignItems = 'center';
        prevBtn.style.justifyContent = 'center';
        prevBtn.style.borderRadius = '50%';
        prevBtn.style.backgroundColor = 'rgba(0, 0, 0, 0.4)';
        prevBtn.style.transition = 'background-color 0.2s';
        prevBtn.onmouseenter = () => prevBtn.style.backgroundColor = 'rgba(0, 0, 0, 0.7)';
        prevBtn.onmouseleave = () => prevBtn.style.backgroundColor = 'rgba(0, 0, 0, 0.4)';
        overlay.appendChild(prevBtn);

        nextBtn = document.createElement('div');
        nextBtn.innerHTML = '&#10095;';
        nextBtn.style.position = 'absolute';
        nextBtn.style.right = '20px';
        nextBtn.style.color = '#fff';
        nextBtn.style.fontSize = '36px';
        nextBtn.style.cursor = 'pointer';
        nextBtn.style.zIndex = '10001';
        nextBtn.style.width = '50px';
        nextBtn.style.height = '50px';
        nextBtn.style.display = 'flex';
        nextBtn.style.alignItems = 'center';
        nextBtn.style.justifyContent = 'center';
        nextBtn.style.borderRadius = '50%';
        nextBtn.style.backgroundColor = 'rgba(0, 0, 0, 0.4)';
        nextBtn.style.transition = 'background-color 0.2s';
        nextBtn.onmouseenter = () => nextBtn.style.backgroundColor = 'rgba(0, 0, 0, 0.7)';
        nextBtn.onmouseleave = () => nextBtn.style.backgroundColor = 'rgba(0, 0, 0, 0.4)';
        overlay.appendChild(nextBtn);
      }

      const dotsContainer = document.createElement('div');
      dotsContainer.style.display = 'flex';
      dotsContainer.style.gap = '8px';
      dotsContainer.style.position = 'absolute';
      dotsContainer.style.bottom = '30px';
      dotsContainer.style.zIndex = '10001';
      overlay.appendChild(dotsContainer);

      const dots = [];
      if (photoList.length > 1) {
        for (let i = 0; i < photoList.length; i++) {
          const dot = document.createElement('div');
          dot.style.width = '10px';
          dot.style.height = '10px';
          dot.style.borderRadius = '50%';
          dot.style.backgroundColor = i === currentIndex ? '#fff' : 'rgba(255,255,255,0.4)';
          dot.style.cursor = 'pointer';
          dot.onclick = (e) => {
            e.stopPropagation();
            showPhoto(i);
          };
          dotsContainer.appendChild(dot);
          dots.push(dot);
        }
      }

      function showPhoto(index) {
        if (index < 0 || index >= photoList.length) return;
        currentIndex = index;
        img.style.opacity = '0';
        setTimeout(() => {
          img.src = photoList[currentIndex];
          img.style.opacity = '1';
        }, 150);

        dots.forEach((dot, i) => {
          dot.style.backgroundColor = i === currentIndex ? '#fff' : 'rgba(255,255,255,0.4)';
        });
      }

      img.src = photoList[currentIndex];

      function nextPhoto() {
        if (currentIndex < photoList.length - 1) {
          showPhoto(currentIndex + 1);
        } else {
          showPhoto(0);
        }
      }

      function prevPhoto() {
        if (currentIndex > 0) {
          showPhoto(currentIndex - 1);
        } else {
          showPhoto(photoList.length - 1);
        }
      }

      if (prevBtn) prevBtn.onclick = (e) => { e.stopPropagation(); prevPhoto(); };
      if (nextBtn) nextBtn.onclick = (e) => { e.stopPropagation(); nextPhoto(); };

      let startX = 0;
      let endX = 0;
      container.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
      }, { passive: true });

      container.addEventListener('touchmove', (e) => {
        endX = e.touches[0].clientX;
      }, { passive: true });

      container.addEventListener('touchend', () => {
        const threshold = 50;
        if (startX - endX > threshold) {
          nextPhoto();
        } else if (endX - startX > threshold) {
          prevPhoto();
        }
      });

      const keyHandler = (e) => {
        if (e.key === 'ArrowRight') nextPhoto();
        else if (e.key === 'ArrowLeft') prevPhoto();
        else if (e.key === 'Escape') closeOverlay();
      };
      document.addEventListener('keydown', keyHandler);

      function closeOverlay() {
        document.removeEventListener('keydown', keyHandler);
        if (overlay.parentNode) {
          document.body.removeChild(overlay);
        }
      }

      closeBtn.onclick = (e) => {
        e.stopPropagation();
        closeOverlay();
      };
      overlay.onclick = (e) => {
        if (e.target === overlay || e.target === container) {
          closeOverlay();
        }
      };

      document.body.appendChild(overlay);
    }

    // window.onload 由 Firebase module script 的 DOMContentLoaded 事件接管，此處留空避免重複執行
  
    async function loadMessages() {
      if (!getDB()) return;
      try {
        const { collection, getDocs, query, orderBy } = fb();
        const q = query(collection(getDB(), 'messages'), orderBy('created_at', 'desc'));
        const snapshot = await getDocs(q);
        
        const container = document.getElementById('msg-list');
        container.innerHTML = '';
        
        if (snapshot.empty) {
          container.innerHTML = '<div class="empty-state">目前還沒有留言喔！來搶頭香吧！</div>';
          return;
        }
        
        snapshot.docs.forEach(d => {
          const msg = { id: d.id, ...d.data() };
          const dateStr = msg.created_at?.toDate ? msg.created_at.toDate().toLocaleString('zh-TW') : '剛剛';
          container.innerHTML += `
            <div style="background: white; border-radius: 8px; padding: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); border-left: 3px solid var(--accent-color);">
              <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px;">
                <span style="font-weight: bold; color: var(--primary-color);">${msg.author}</span>
                <div style="display:flex; gap:8px; align-items:center;">
                  <span style="font-size: 0.75rem; color: #888;">${dateStr}</span>
                  <button onclick="deleteMessage('${msg.id}')" style="background:none; border:none; cursor:pointer; font-size:0.8rem; color:#db4437;" title="刪除留言">🗑️</button>
                </div>
              </div>
              <div style="color: var(--text-main); font-size: 0.95rem; white-space: pre-wrap; line-height: 1.4;">${msg.content}</div>
            </div>
          `;
        });
      } catch (err) {
        console.log("載入留言失敗:", err.message);
        document.getElementById('msg-list').innerHTML = `<div class="empty-state" style="color:red;">載入留言失敗：${err.message}</div>`;
      }
    }

    async function submitMessage(event) {
      event.preventDefault();
      if (!getDB()) return alert("Firebase 尚未初始化！");
      
      const author = document.getElementById('msg-author').value.trim();
      const content = document.getElementById('msg-content').value.trim();
      if (!author || !content) return;
      
      const btn = document.getElementById('msg-submit-btn');
      btn.disabled = true;
      btn.innerText = "傳送中...";
      
      try {
        const { collection, addDoc, serverTimestamp } = fb();
        await addDoc(collection(getDB(), 'messages'), { author, content, created_at: serverTimestamp() });
        document.getElementById('msg-content').value = '';
        await loadMessages();
      } catch (err) {
        alert("留言失敗：" + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "🚀 送出留言";
      }
    }

    async function deleteMessage(msgId) {
      const pwd = prompt("請輸入刪除密碼：");
      if (pwd === null) return;
      if (pwd !== "8888") {
        alert("密碼錯誤，無法刪除留言！");
        return;
      }
      if (!confirm("確定要刪除這筆留言嗎？")) return;

      if (!getDB()) return alert("Firebase 尚未初始化！");

      try {
        const { deleteDoc, doc } = fb();
        await deleteDoc(doc(getDB(), 'messages', msgId));
        alert("留言已成功刪除！");
        await loadMessages();
      } catch (err) {
        alert("刪除失敗：" + err.message);
      }
    }

  </script>
